<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A1834">
<title>Club de los $3.500</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-900:#0A1834;
    --navy-700:#13295A;
    --navy-500:#1F3C7A;
    --gold:#D4AF55;
    --gold-light:#F3E3B5;
    --gold-deep:#A67C2E;
    --ivory:#FBF8F1;
    --white:#FFFFFF;
    --display:'Cinzel', Georgia, 'Times New Roman', serif;
    --body:'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    font-family:var(--body);
    color:var(--white);
    background:
      radial-gradient(ellipse 80% 55% at 50% 42%, #1B3566 0%, rgba(27,53,102,0) 70%),
      linear-gradient(180deg, var(--navy-900) 0%, #0D1F44 55%, var(--navy-900) 100%);
    background-size:cover;background-position:center;background-repeat:no-repeat;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
  }

  /* ---------- Layout: todo cabe en una pantalla, sin scroll ---------- */
  .app{
    height:100vh;height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:max(18px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
    gap:10px;
  }

  header{text-align:center}
  html{--fs-space:104px}   /* espacio para los botones de reinicio y pantalla completa */
  h1{
    font-family:var(--display);font-weight:800;
    font-size:clamp(20px, 7vw, 64px);font-size:clamp(16px, calc((100vw - 32px - var(--fs-space, 0px)) / 11.9), 64px);text-wrap:balance;
    letter-spacing:.06em;line-height:1;
    background:linear-gradient(180deg,#F8EBC4 0%, var(--gold) 55%, var(--gold-deep) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  /* ---------- Ruleta ---------- */
  .stage{
    flex:1 1 auto;min-height:0;width:100%;
    display:flex;align-items:center;justify-content:center;
  }
  .wheel-wrap{
    position:relative;
    width:min(92vw, 100%, 620px);
    aspect-ratio:1/1;
    max-height:100%;
  }
  /* Limita el tamaño por la altura disponible */
  @supports (width: 1cqh){ .stage{container-type:size} .wheel-wrap{width:min(94cqw, 94cqh, 640px)} }

  .wheel-halo{
    position:absolute;inset:-4%;border-radius:50%;
    background:radial-gradient(circle, rgba(212,175,85,.28) 0%, rgba(212,175,85,0) 68%);
    pointer-events:none;
  }
  #wheel{
    position:absolute;inset:0;width:100%;height:100%;
    border-radius:50%;
    will-change:transform;
    filter:drop-shadow(0 18px 40px rgba(0,0,0,.45));
  }
  /* Brillo fijo sobre la ruleta (no gira, simula luz real) */
  .wheel-gloss{
    position:absolute;inset:3%;border-radius:50%;pointer-events:none;z-index:1;
    background:
      radial-gradient(ellipse 70% 45% at 38% 18%, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 70%),
      radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 62%, rgba(0,0,0,.18) 100%);
  }
  /* Centro fijo (no gira) */
  .hub{
    position:absolute;left:50%;top:50%;width:17%;aspect-ratio:1/1;z-index:2;
    transform:translate(-50%,-50%);border-radius:50%;
    background:
      radial-gradient(circle at 38% 30%, #FFF4CF 0%, #E6C66E 30%, #C79A3A 62%, #8C6420 100%);
    box-shadow:0 0 0 3px #8C6420, 0 0 0 6px #0A1834, 0 0 0 8px #D4AF55, 0 10px 24px rgba(0,0,0,.5), inset 0 -4px 8px rgba(94,66,20,.45), inset 0 3px 5px rgba(255,255,255,.6);
    display:flex;align-items:center;justify-content:center;
    appearance:none;-webkit-appearance:none;border:0;padding:0;margin:0;cursor:pointer;
    transition:transform .12s ease;
  }
  /* El centro también es botón de girar */
  .hub:active:not(:disabled){transform:translate(-50%,-50%) scale(.92)}
  .hub:disabled{cursor:default}
  .hub:focus-visible{outline:3px solid var(--white);outline-offset:6px}
  .hub svg{width:58%;height:58%;filter:drop-shadow(0 1px 1px rgba(255,255,255,.45))}
  .hub::after{content:'';position:absolute;inset:8%;border-radius:50%;border:1.5px solid rgba(255,244,207,.6);pointer-events:none}
  /* Flecha fija arriba */
  .pointer{
    position:absolute;left:50%;top:-3.5%;width:12%;
    transform:translateX(-50%);transform-origin:50% 15%;
    z-index:3;filter:drop-shadow(0 5px 6px rgba(0,0,0,.55));
  }
  .pointer.flick{animation:flick .12s ease-out}
  @keyframes flick{0%{transform:translateX(-50%) rotate(0)}40%{transform:translateX(-50%) rotate(-14deg)}100%{transform:translateX(-50%) rotate(0)}}

  /* ---------- Botón ---------- */
  .spin-btn{
    appearance:none;border:0;cursor:pointer;
    font-family:var(--display);font-weight:800;letter-spacing:.14em;
    font-size:clamp(24px, 5.4vw, 40px);
    color:var(--navy-900);
    padding:.55em 2.4em .5em;border-radius:999px;
    background:linear-gradient(180deg,#F8EBC4 0%, var(--gold) 50%, var(--gold-deep) 100%);
    box-shadow:0 6px 0 #7C5A1E, 0 14px 28px rgba(0,0,0,.45);
    transition:transform .08s ease, box-shadow .08s ease, opacity .2s ease, filter .2s;
  }
  .spin-btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #7C5A1E, 0 8px 18px rgba(0,0,0,.45)}
  .spin-btn:disabled{filter:grayscale(.55) brightness(.8);cursor:default}
  .spin-btn:focus-visible, .next-btn:focus-visible, .fs-btn:focus-visible{outline:3px solid var(--white);outline-offset:4px}

  /* ---------- Premios (tira inferior) ---------- */
  .prizes{
    display:grid;grid-template-columns:repeat(4, 1fr);gap:clamp(6px, 1.6vw, 16px);
    width:min(100%, 640px);
  }
  .prize{
    display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
    appearance:none;-webkit-appearance:none;background:none;border:0;padding:0;font:inherit;color:inherit;
  }
  .prize .pic{position:relative;width:100%;max-width:92px}
  .prize img{
    display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:50%;
    border:2px solid rgba(212,175,85,.55);background:var(--ivory);
  }
  /* Premio quitado de la ruleta: se ve apagado y al tocarlo se puede volver a poner */
  .prize.agotado{cursor:pointer}
  .prize.agotado img{filter:grayscale(1) brightness(.55);border-color:rgba(255,255,255,.25)}
  .prize.agotado span{opacity:.6;text-decoration:line-through}
  .prize .badge{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-10deg);
    font-style:normal;font-weight:700;font-size:clamp(10px, 2.3vw, 13px);letter-spacing:.03em;white-space:nowrap;
    color:var(--navy-900);background:var(--gold-light);padding:.25em .55em;border-radius:6px;
    box-shadow:0 2px 8px rgba(0,0,0,.45);
  }
  .prize.agotado:focus-visible{outline:3px solid var(--white);outline-offset:4px;border-radius:12px}
  .prize span{font-size:clamp(11px, 2.4vw, 15px);line-height:1.15;color:#DCE3F2;font-weight:500}
  .prize.featured img{border:3px solid var(--gold);box-shadow:0 0 0 3px rgba(212,175,85,.25), 0 0 22px rgba(212,175,85,.55)}
  .prize.featured span{color:var(--gold-light);font-weight:700}

  /* Pantalla completa (solo aparece si el navegador lo soporta) */
  .fs-btn{
    position:fixed;top:max(10px, env(safe-area-inset-top));right:12px;z-index:5;
    width:40px;height:40px;border-radius:50%;border:1px solid rgba(212,175,85,.5);
    background:rgba(10,24,52,.6);color:var(--gold-light);cursor:pointer;
    display:none;align-items:center;justify-content:center;
  }
  .fs-btn svg{width:20px;height:20px}
  /* Reiniciar (arriba a la izquierda): vuelve a poner todos los premios */
  .reset-btn{
    position:fixed;top:max(10px, env(safe-area-inset-top));left:12px;z-index:5;
    width:40px;height:40px;border-radius:50%;border:1px solid rgba(212,175,85,.5);
    background:rgba(10,24,52,.6);color:var(--gold-light);cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
    transition:transform .12s ease, opacity .2s ease;
  }
  .reset-btn svg{width:20px;height:20px}
  .reset-btn:active:not(:disabled){transform:scale(.9)}
  .reset-btn:disabled{opacity:.4;cursor:default}
  .reset-btn:focus-visible{outline:3px solid var(--white);outline-offset:4px}

  /* ---------- Modal resultado ---------- */
  .overlay{
    position:fixed;inset:0;z-index:20;
    display:flex;align-items:center;justify-content:center;padding:20px;
    background:rgba(6,14,32,.72);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    opacity:0;visibility:hidden;transition:opacity .3s ease, visibility .3s;
  }
  .overlay.show{opacity:1;visibility:visible}
  .card{
    position:relative;overflow:hidden;isolation:isolate;
    width:min(92vw, 520px);max-height:94dvh;
    background:radial-gradient(120% 70% at 50% 0%, #FFFFFF 0%, #FBF8F1 55%, #F1E8D4 100%);
    color:var(--navy-900);border-radius:30px;
    padding:clamp(28px, 6.5vw, 44px) clamp(18px, 5vw, 34px) clamp(22px, 5vw, 32px);
    text-align:center;
    box-shadow:0 0 0 2px var(--gold), 0 0 0 9px rgba(212,175,85,.18), 0 0 70px rgba(212,175,85,.35), 0 30px 80px rgba(0,0,0,.55);
    transform:scale(.8) translateY(20px);transition:transform .45s cubic-bezier(.2,1.4,.4,1);
    display:flex;flex-direction:column;align-items:center;
  }
  /* Marco interior fino dorado */
  .card::before{
    content:'';position:absolute;inset:10px;border-radius:22px;pointer-events:none;z-index:-1;
    border:1px solid rgba(166,124,46,.45);
  }
  .overlay.show .card{transform:scale(1) translateY(0)}

  /* Serpentinas decorativas en las esquinas */
  .streamer{position:absolute;top:-8px;width:32%;max-width:170px;z-index:-1;pointer-events:none}
  .streamer.left{left:-6px}
  .streamer.right{right:-6px;transform:scaleX(-1)}
  .overlay.show .streamer path{animation:draw 1.1s ease-out both}
  @keyframes draw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}

  .congrats{font-family:var(--display);font-weight:800;font-size:clamp(25px, 6.2vw, 42px);color:var(--navy-700);line-height:1.1}
  .won-label{
    margin-top:10px;font-weight:600;letter-spacing:.34em;font-size:clamp(14px, 3vw, 18px);color:var(--gold-deep);
    display:flex;align-items:center;gap:12px;
  }
  .won-label::before,.won-label::after{content:'';width:34px;height:1px;background:linear-gradient(90deg, transparent, var(--gold))}
  .won-label::after{transform:scaleX(-1)}

  /* Foto del premio con rayos dorados detrás */
  .won-media{position:relative;width:min(56vw, 250px, 31dvh);aspect-ratio:1/1;margin:20px 0 14px}
  .rays{
    position:absolute;inset:-30%;border-radius:50%;z-index:-1;
    background:repeating-conic-gradient(from 0deg, rgba(212,175,85,.38) 0deg 6deg, rgba(212,175,85,0) 6deg 18deg);
    -webkit-mask:radial-gradient(circle, #000 28%, transparent 70%);mask:radial-gradient(circle, #000 28%, transparent 70%);
    animation:rays 22s linear infinite;
  }
  @keyframes rays{to{transform:rotate(360deg)}}
  .won-img{
    width:100%;height:100%;object-fit:cover;border-radius:26px;display:block;
    border:6px solid transparent;
    background:linear-gradient(#FBF8F1,#FBF8F1) padding-box, linear-gradient(135deg,#F8EBC4 0%,#D4AF55 35%,#8C6420 60%,#E9CC7C 100%) border-box;
    box-shadow:0 0 0 5px rgba(255,255,255,.85), 0 0 0 6px rgba(212,175,85,.55), 0 18px 36px rgba(10,24,52,.3);
  }
  .spark{position:absolute;width:9%;aspect-ratio:1;fill:var(--gold);animation:twinkle 1.6s ease-in-out infinite}
  .spark.s1{top:-4%;right:6%}
  .spark.s2{bottom:4%;left:-6%;width:7%;animation-delay:.5s}
  .spark.s3{top:24%;left:-10%;width:5%;animation-delay:1s}
  .spark.s4{bottom:-2%;right:-4%;width:6%;animation-delay:.8s}
  @keyframes twinkle{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1.1);opacity:1}}

  .won-name{
    font-family:var(--display);font-weight:800;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;
    font-size:clamp(28px, 7.6vw, 52px);font-size:clamp(26px, min(7.6vw, 5.4dvh), 52px);color:var(--navy-900);max-width:14ch;
  }
  .note{margin-top:14px;font-size:clamp(15px, 3.2vw, 18px);color:#4A5A7A;max-width:32ch;line-height:1.4}
  .next-btn{
    margin-top:22px;appearance:none;border:0;cursor:pointer;
    font-family:var(--body);font-weight:700;letter-spacing:.05em;
    font-size:clamp(15px, 3.9vw, 20px);white-space:nowrap;
    padding:1em 1.5em;border-radius:999px;
    background:linear-gradient(180deg, #1F3C7A 0%, var(--navy-900) 100%);color:var(--gold-light);
    box-shadow:0 0 0 2px var(--gold) inset, 0 10px 22px rgba(10,24,52,.3);
  }
  .next-btn:active{transform:translateY(2px)}
  .remove-btn{
    margin-top:10px;appearance:none;border:0;background:none;cursor:pointer;
    font-family:var(--body);font-weight:600;font-size:clamp(14px, 3.4vw, 16px);
    color:#6B5220;text-decoration:underline;text-underline-offset:3px;padding:.6em .9em;
  }
  .remove-btn[hidden]{display:none}
  .remove-btn:focus-visible{outline:3px solid var(--gold-deep);outline-offset:2px;border-radius:8px}

  /* ---- Resultado especial: premio destacado (featured: true) ---- */
  .card.featured{
    background:radial-gradient(120% 80% at 50% 0%, #25468A 0%, #13295A 45%, #0A1834 100%);color:var(--white);
    box-shadow:0 0 0 2px var(--gold), 0 0 0 9px rgba(212,175,85,.28), 0 0 110px rgba(212,175,85,.55), 0 30px 80px rgba(0,0,0,.6);
  }
  .card.featured::before{border:1.5px dashed rgba(212,175,85,.7)}
  .card.featured .congrats{color:var(--gold-light)}
  .card.featured .won-label{color:var(--gold)}
  .card.featured .won-img{border-radius:22px;background:linear-gradient(#0A1834,#0A1834) padding-box, linear-gradient(135deg,#F8EBC4 0%,#D4AF55 35%,#8C6420 60%,#E9CC7C 100%) border-box;box-shadow:0 0 0 5px rgba(212,175,85,.25), 0 0 40px rgba(212,175,85,.45), 0 18px 36px rgba(0,0,0,.45)}
  .card.featured .rays{background:repeating-conic-gradient(from 0deg, rgba(243,227,181,.45) 0deg 6deg, rgba(243,227,181,0) 6deg 16deg)}
  .card.featured .spark{fill:var(--gold-light)}
  .card.featured .won-name{
    background:linear-gradient(100deg, #A67C2E 0%, #F8EBC4 20%, #D4AF55 40%, #A67C2E 60%, #F8EBC4 80%, #D4AF55 100%);
    background-size:200% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-size:clamp(40px, 11vw, 74px);
    animation:foil 3s linear infinite;
  }
  @keyframes foil{to{background-position:-200% 0}}
  .card.featured .note{color:#C9D3E8}
  .card.featured .next-btn{background:linear-gradient(180deg,#F8EBC4 0%, var(--gold) 50%, var(--gold-deep) 100%);color:var(--navy-900);box-shadow:0 10px 22px rgba(0,0,0,.4)}

  .card.featured .remove-btn{color:var(--gold-light)}

  /* ---------- Confirmación: quitar o volver a poner un premio ---------- */
  .ask{
    position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;
    background:rgba(6,14,32,.62);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    opacity:0;visibility:hidden;transition:opacity .2s ease, visibility .2s;
  }
  .ask.show{opacity:1;visibility:visible}
  .ask-card{
    width:min(90vw, 420px);border-radius:24px;padding:26px 22px 22px;text-align:center;
    background:radial-gradient(120% 80% at 50% 0%, #25468A 0%, #13295A 50%, #0A1834 100%);
    box-shadow:0 0 0 2px var(--gold), 0 0 0 8px rgba(212,175,85,.18), 0 24px 60px rgba(0,0,0,.55);
  }
  .ask-title{font-weight:700;font-size:clamp(19px, 4.6vw, 24px);line-height:1.25;color:var(--gold-light)}
  .ask-text{margin-top:10px;font-size:clamp(15px, 3.6vw, 17px);line-height:1.4;color:#C9D3E8}
  .ask-actions{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .ask-actions button{
    appearance:none;border:0;cursor:pointer;border-radius:999px;padding:.85em 1.4em;
    font-family:var(--body);font-weight:700;font-size:clamp(15px, 3.8vw, 17px);
  }
  .ask-yes{background:linear-gradient(180deg,#F8EBC4 0%, var(--gold) 50%, var(--gold-deep) 100%);color:var(--navy-900);box-shadow:0 8px 18px rgba(0,0,0,.35)}
  .ask-no{background:transparent;color:var(--gold-light);box-shadow:0 0 0 1.5px rgba(212,175,85,.75) inset}
  .ask-actions button:focus-visible{outline:3px solid var(--white);outline-offset:3px}

  /* Aviso breve arriba */
  .toast{
    position:fixed;left:50%;top:max(14px, env(safe-area-inset-top));z-index:45;
    transform:translate(-50%, -16px);max-width:92vw;
    padding:.7em 1.2em;border-radius:999px;text-align:center;
    font-weight:600;font-size:clamp(14px, 3.4vw, 16px);color:var(--gold-light);
    background:rgba(10,24,52,.94);box-shadow:0 0 0 1px rgba(212,175,85,.6), 0 12px 28px rgba(0,0,0,.45);
    opacity:0;visibility:hidden;transition:opacity .25s ease, transform .25s ease, visibility .25s;
  }
  .toast.show{opacity:1;visibility:visible;transform:translate(-50%, 0)}

  #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

  /* Pantallas bajas (iPad horizontal, iPhone SE): resultado más compacto */
  @media (max-height:780px){
    .card{padding-top:clamp(20px, 3.4dvh, 30px);padding-bottom:clamp(14px, 2.4dvh, 22px)}
    .won-label{margin-top:6px}
    .won-media{margin:12px 0 8px}
    .note{margin-top:8px}
    .next-btn{margin-top:14px}
    .remove-btn{margin-top:4px}
  }

  /* Pantallas bajas (teléfono horizontal): ocultar tira de premios */
  @media (max-height:520px){ .prizes{display:none} .card{overflow-y:auto} }

  @media (prefers-reduced-motion: reduce){
    .card{transition:none} .pointer.flick{animation:none}
    .rays,.spark,.card.featured .won-name,.overlay.show .streamer path{animation:none}
  }
</style>
</head>
<body>

<button class="fs-btn" id="fsBtn" aria-label="Pantalla completa">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>

<button class="reset-btn" id="resetBtn" type="button" aria-label="Reiniciar la ruleta" title="Reiniciar la ruleta">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.64-6.36L3 8.3"/><path d="M3 3v5.3h5.3"/></svg>
</button>

<main class="app">
  <header>
    <h1>CLUB DE LOS $3.500</h1>
  </header>

  <section class="stage">
    <div class="wheel-wrap">
      <div class="wheel-halo"></div>
      <canvas id="wheel" aria-label="Ruleta de premios"></canvas>
      <div class="wheel-gloss" aria-hidden="true"></div>
      <button class="hub" id="hubBtn" type="button" aria-label="Girar la ruleta">
        <svg viewBox="0 0 24 24"><defs><linearGradient id="hs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A4D96"/><stop offset="1" stop-color="#0A1834"/></linearGradient></defs><path d="M12 2.5l2.7 6.1 6.6.6-5 4.4 1.5 6.5L12 16.7l-5.8 3.4 1.5-6.5-5-4.4 6.6-.6z" fill="url(#hs)"/></svg>
      </button>
      <svg class="pointer" id="pointer" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFF1C7"/><stop offset=".35" stop-color="#E0BC5E"/><stop offset=".7" stop-color="#A67C2E"/><stop offset="1" stop-color="#F0D383"/>
          </linearGradient>
          <linearGradient id="pn" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2A4D96"/><stop offset="1" stop-color="#0A1834"/>
          </linearGradient>
        </defs>

<script>
/* =====================================================================
   CONFIGURACIÓN DE PREMIOS  —  EDITA SOLO ESTA SECCIÓN
   ---------------------------------------------------------------------
   name     : texto que se ve en la ruleta y en el resultado
   weight   : probabilidad (en %). Deben sumar 100 (si no suman 100,
              el sistema las reparte proporcionalmente igual).
   image    : nombre/ruta del archivo de imagen. Si el archivo existe
              junto a index.html se usa ese; si no, se usa la foto que
              ya viene incrustada en este archivo.
   crop     : (opcional) parte de la foto que se ve en los círculos de la
              ruleta y de la tira de premios: [centro X, centro Y, radio]
              en fracciones de la foto (0 a 1). Sin crop se usa el centro.
              En la pantalla de resultado siempre sale la foto completa.
   featured : true = premio destacado (segmento dorado y resultado especial)
   ===================================================================== */
const PRIZES = [
  { name: "Sartén Gourmet 10”", weight: 25, image: "sarten-gourmet-10.jpg", crop: [0.62, 0.62, 0.36] },
  { name: "Sartén Elite 8”",    weight: 25, image: "sarten-elite-8.jpg",    crop: [0.40, 0.45, 0.34] },
  { name: "Paellera Party",     weight: 25, image: "paellera-party.jpg",    crop: [0.52, 0.52, 0.45] },
  { name: "Tabla de Bambú",     weight: 25, image: "tabla-bambu.jpg",       crop: [0.49, 0.52, 0.46] },
];

/* Ajustes generales (opcional) */
const SETTINGS = {
  minDuration: 4500,   // ms — duración mínima del giro
  maxDuration: 5800,   // ms — duración máxima del giro
  minSpins: 6,         // vueltas completas mínimas
  maxSpins: 8,         // vueltas completas máximas
  sound: true,         // sonido "tick" y campanita final
  background: "fondo.jpg", // imagen de fondo de la pantalla ("" = azul liso)
  remember: true,      // recuerda en este dispositivo los premios quitados (aunque se recargue)
};
/* Diseño de la ruleta en imagen (opcional). Vacío = la ruleta se dibuja
   sola con las fotos de PRIZES. Si algún día usas una imagen, debe tener
   los premios en el MISMO orden que PRIZES, en sentido horario, con el
   primero centrado arriba. Si no carga, se dibuja la ruleta con las fotos. */
const WHEEL_ART = {
  image: "",
  offsetDeg: null,   // null = automático (primer premio centrado arriba)
};
/* ===================== FIN DE LA CONFIGURACIÓN ===================== */


/* ---------------------------------------------------------------------
   1. ALEATORIEDAD SEGURA
   Usa crypto.getRandomValues() cuando existe; si no, Math.random().
   Devuelve un número en [0, 1).
   --------------------------------------------------------------------- */
function secureRandom() {
  if (window.crypto && window.crypto.getRandomValues) {
    const buf = new Uint32Array(1);
    window.crypto.getRandomValues(buf);
    return buf[0] / 4294967296; // 2^32
  }
  return Math.random();
}

/* ---------------------------------------------------------------------
   2. SELECCIÓN PONDERADA
   Suma los pesos, saca un número aleatorio entre 0 y el total y
   recorre los premios acumulando pesos hasta encontrar el ganador.
   Ej.: pesos 25/25/25/25 → rangos [0-25) [25-50) [50-75) [75-100)
   --------------------------------------------------------------------- */
function pickWeightedIndex(prizes) {
  const total = prizes.reduce((sum, p) => sum + Math.max(0, p.weight), 0);
  const r = secureRandom() * total;
  let acc = 0;
  for (let i = 0; i < prizes.length; i++) {
    acc += Math.max(0, prizes[i].weight);
    if (r < acc) return i;
  }
  return prizes.length - 1; // salvaguarda por redondeo
}

/* ---------------------------------------------------------------------
   3. CARGA DE IMÁGENES
   Intenta el archivo indicado; si falla, usa la versión incrustada.
   --------------------------------------------------------------------- */
function loadImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => {
      const fallback = (window.EMBEDDED_IMAGES || {})[src];
      if (fallback && img.src !== fallback) { img.src = fallback; }
      else resolve(null);
    };
    img.src = src;
  });
}

/* ---------------------------------------------------------------------
   4. DIBUJO DE LA RULETA (canvas)
   Todos los segmentos tienen el mismo tamaño visual; la probabilidad real
   la decide la selección ponderada, no el tamaño del segmento.
   El segmento 0 empieza en la parte superior y avanzan en sentido horario.
   --------------------------------------------------------------------- */
const wheel = document.getElementById('wheel');
const ctx = wheel.getContext('2d');
// Premios que siguen en la ruleta (posiciones en PRIZES). Al quitar uno,
// su probabilidad se reparte entre los que quedan.
let active = PRIZES.map((_, i) => i);
let SEG = 360 / active.length;
let WIDE = SEG >= 90;     // 4 premios o menos: fotos y letras más grandes
function updateGeometry() { SEG = 360 / active.length; WIDE = SEG >= 90; }
const PALETTE = [
  { fill: '#13295A', text: '#FFFFFF' },  // azul marino
  { fill: '#FBF8F1', text: '#0A1834' },  // blanco marfil
];
const ROYAL_STYLE = { fill: '#1F3C7A', text: '#FFFFFF' };    // azul real (cantidad impar)
const FEATURED_STYLE = { fill: 'gold', text: '#0A1834' };
let images = [];

// Estilo del segmento que está en la posición i de la ruleta
function segmentStyle(i) {
  if (PRIZES[active[i]].featured) return FEATURED_STYLE;
  // alterna colores entre los no destacados
  let n = 0, total = 0;
  for (let k = 0; k < active.length; k++) {
    if (PRIZES[active[k]].featured) continue;
    if (k < i) n++;
    total++;
  }
  // con una cantidad impar, el último no repite el color del primero
  if (total > 1 && total % 2 === 1 && n === total - 1) return ROYAL_STYLE;
  return PALETTE[n % 2];
}

function wrapText(text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// Zona cuadrada de la foto que se ve en los círculos (ver "crop" en PRIZES)
function cropBox(p, img) {
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const m = Math.min(iw, ih);
  const [cx, cy, rad] = Array.isArray(p.crop) ? p.crop : [0.5, 0.5, 0.5];
  const side = Math.min(m, Math.max(1, 2 * rad * m));
  const sx = Math.min(Math.max(0, cx * iw - side / 2), iw - side);
  const sy = Math.min(Math.max(0, cy * ih - side / 2), ih - side);
  return [sx, sy, side];
}

let wheelArt = null;

// Ruleta con el diseño en imagen (se usa si la imagen cargó)
function drawWheel() {
  // el diseño en imagen trae todos los premios: si se quitó alguno, se dibuja por código
  if (!wheelArt || active.length !== PRIZES.length) return drawWheelClassic();
  const cssSize = wheel.getBoundingClientRect().width;
  if (!cssSize) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  wheel.width = Math.round(cssSize * dpr);
  wheel.height = Math.round(cssSize * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const c = cssSize / 2;
  ctx.clearRect(0, 0, cssSize, cssSize);
  ctx.save();
  ctx.beginPath(); ctx.arc(c, c, c * 0.995, 0, Math.PI * 2); ctx.clip();
  ctx.translate(c, c);
  ctx.rotate((WHEEL_ART.offsetDeg == null ? SEG / 2 : WHEEL_ART.offsetDeg) * Math.PI / 180);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(wheelArt, -c, -c, cssSize, cssSize);
  ctx.restore();
}

// Ruleta dibujada por código (respaldo)
function drawWheelClassic() {
  const cssSize = wheel.getBoundingClientRect().width;
  if (!cssSize) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  wheel.width = Math.round(cssSize * dpr);
  wheel.height = Math.round(cssSize * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const c = cssSize / 2;
  const R = c * 0.985;           // radio exterior
  const rimW = R * 0.12;         // aro metálico grueso
  const r = R - rimW;            // radio de los segmentos
  const toRad = d => (d - 90) * Math.PI / 180; // 0° = arriba
  const TAU = Math.PI * 2;

  ctx.clearRect(0, 0, cssSize, cssSize);

  // --- Aro exterior metálico dorado ---
  let metal;
  if (ctx.createConicGradient) {
    metal = ctx.createConicGradient(-Math.PI / 2, c, c);
    ['#F8EBC4','#B8892F','#F3DC9A','#8C6420','#F8EBC4','#B8892F','#F3DC9A','#8C6420','#F8EBC4']
      .forEach((col, k, arr) => metal.addColorStop(k / (arr.length - 1), col));
  } else {
    metal = ctx.createLinearGradient(0, 0, cssSize, cssSize);
    metal.addColorStop(0, '#F8EBC4'); metal.addColorStop(.35, '#C49A43');
    metal.addColorStop(.6, '#8C6420'); metal.addColorStop(1, '#F3DC9A');
  }
  ctx.beginPath(); ctx.arc(c, c, R, 0, TAU); ctx.fillStyle = metal; ctx.fill();
  ctx.lineWidth = R * 0.012; ctx.strokeStyle = '#5E4214';
  ctx.beginPath(); ctx.arc(c, c, R - ctx.lineWidth / 2, 0, TAU); ctx.stroke();

  // Canal azul marino dentro del aro (donde van las luces)
  const chOut = R - rimW * 0.2, chIn = r + rimW * 0.2;
  const ch = ctx.createRadialGradient(c, c, chIn, c, c, chOut);
  ch.addColorStop(0, '#0A1834'); ch.addColorStop(.5, '#1A3570'); ch.addColorStop(1, '#0A1834');
  ctx.beginPath(); ctx.arc(c, c, chOut, 0, TAU); ctx.arc(c, c, chIn, 0, TAU, true);
  ctx.fillStyle = ch; ctx.fill();

  // Luces tipo marquesina
  const bulbs = active.length * Math.max(4, Math.round(20 / active.length)), midRim = (chOut + chIn) / 2, bR = (chOut - chIn) * 0.26;
  for (let k = 0; k < bulbs; k++) {
    const a = toRad(k * 360 / bulbs + 360 / bulbs / 2);
    const x = c + Math.cos(a) * midRim, y = c + Math.sin(a) * midRim;
    const glow = ctx.createRadialGradient(x, y, 0, x, y, bR * 2.6);
    glow.addColorStop(0, 'rgba(255,240,200,.55)'); glow.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, bR * 2.6, 0, TAU); ctx.fill();
    const core = ctx.createRadialGradient(x - bR * .3, y - bR * .3, 0, x, y, bR);
    core.addColorStop(0, '#FFFFFF'); core.addColorStop(.6, '#FBEFC9'); core.addColorStop(1, '#D4AF55');
    ctx.fillStyle = core; ctx.beginPath(); ctx.arc(x, y, bR, 0, TAU); ctx.fill();
  }

  // --- Segmentos ---
  active.forEach((pi, i) => {
    const a0 = toRad(i * SEG), a1 = toRad((i + 1) * SEG);
    const st = segmentStyle(i);
    let g = ctx.createRadialGradient(c, c, r * 0.15, c, c, r);
    if (st.fill === 'gold') { g.addColorStop(0, '#FBEFC9'); g.addColorStop(.6, '#D4AF55'); g.addColorStop(1, '#9E7428'); }
    else if (st.fill === '#13295A') { g.addColorStop(0, '#264A8F'); g.addColorStop(1, '#0D1E45'); }
    else if (st.fill === '#1F3C7A') { g.addColorStop(0, '#3B64B5'); g.addColorStop(1, '#17316B'); }
    else { g.addColorStop(0, '#FFFFFF'); g.addColorStop(1, '#EDE3CC'); }
    ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, r, a0, a1); ctx.closePath();
    ctx.fillStyle = g; ctx.fill();
  });

  // Sombra interior junto al aro (profundidad)
  const depth = ctx.createRadialGradient(c, c, r * 0.78, c, c, r);
  depth.addColorStop(0, 'rgba(0,0,0,0)'); depth.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.beginPath(); ctx.arc(c, c, r, 0, TAU); ctx.fillStyle = depth; ctx.fill();

  // --- Divisiones doradas (con un solo premio no hay divisiones) ---
  if (active.length > 1) active.forEach((pi, i) => {
    const a = toRad(i * SEG);
    const x1 = c + Math.cos(a) * r * 0.18, y1 = c + Math.sin(a) * r * 0.18;
    const x2 = c + Math.cos(a) * r, y2 = c + Math.sin(a) * r;
    const lg = ctx.createLinearGradient(x1, y1, x2, y2);
    lg.addColorStop(0, '#8C6420'); lg.addColorStop(.5, '#F3DC9A'); lg.addColorStop(1, '#B8892F');
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = R * 0.02;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.strokeStyle = lg; ctx.lineWidth = R * 0.013;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  });
  // Filete dorado entre segmentos y aro
  ctx.lineWidth = R * 0.016; ctx.strokeStyle = metal;
  ctx.beginPath(); ctx.arc(c, c, r, 0, TAU); ctx.stroke();

  // --- Contenido de cada segmento: foto + nombre ---
  active.forEach((pi, i) => {
    const p = PRIZES[pi];
    const mid = toRad(i * SEG + SEG / 2);
    const st = segmentStyle(i);
    const onNavy = st.fill === '#13295A' || st.fill === '#1F3C7A';
    ctx.save();
    ctx.translate(c, c);
    ctx.rotate(mid + Math.PI / 2);

    // Nombre en mayúsculas (solo visual; el nombre real sigue en PRIZES)
    const label = p.name.toUpperCase();
    let fontSize = Math.max(9, r * (WIDE ? 0.078 : 0.068));
    ctx.font = `700 ${fontSize}px Outfit, system-ui, sans-serif`;
    if ('letterSpacing' in ctx) ctx.letterSpacing = `${(fontSize * 0.06).toFixed(1)}px`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = onNavy ? '#F3E3B5' : '#0A1834';
    ctx.shadowColor = onNavy ? 'rgba(0,0,0,.45)' : 'rgba(255,255,255,.6)';
    ctx.shadowBlur = 2; ctx.shadowOffsetY = onNavy ? 1 : 0.5;
    if (WIDE) {
      // Segmentos anchos: el nombre sigue la curva del aro, sin tocarlo
      if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
      const rho = r * 0.86;                                  // radio de la línea de texto
      const usable = (SEG - 16) * Math.PI / 180 * rho;       // arco libre entre divisiones
      const gap = () => fontSize * 0.06;
      const textW = () => [...label].reduce((w, ch) => w + ctx.measureText(ch).width + gap(), -gap());
      let w = textW();
      if (w > usable) {                                      // nombre muy largo: letra más pequeña
        fontSize *= usable / w;
        ctx.font = `700 ${fontSize}px Outfit, system-ui, sans-serif`;
        w = textW();
      }
      let a = -w / 2 / rho;
      for (const ch of label) {
        const cw = ctx.measureText(ch).width;
        a += cw / 2 / rho;
        ctx.save(); ctx.rotate(a); ctx.fillText(ch, 0, -rho); ctx.restore();
        a += (cw / 2 + gap()) / rho;
      }
    } else {
      const maxW = 2 * r * 0.8 * Math.sin((SEG / 2) * Math.PI / 180) * 0.86;
      const lines = wrapText(label, maxW);
      const lh = fontSize * 1.14;
      const textY = -r * 0.88 + lh * 0.5;
      lines.forEach((ln, k) => ctx.fillText(ln, 0, textY + k * lh));
    }
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';

    // Foto en medallón con marco dorado
    const img = images[pi];
    const imgR = r * (WIDE ? 0.25 : 0.2);
    const imgY = -r * (WIDE ? 0.52 : 0.47);
    ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = r * 0.04; ctx.shadowOffsetY = r * 0.012;
    ctx.beginPath(); ctx.arc(0, imgY, imgR + r * 0.03, 0, TAU);
    ctx.fillStyle = metal; ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.beginPath(); ctx.arc(0, imgY, imgR + r * 0.008, 0, TAU);
    ctx.fillStyle = '#5E4214'; ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(0, imgY, imgR, 0, TAU); ctx.clip();
    ctx.fillStyle = '#FBF8F1'; ctx.fillRect(-imgR, imgY - imgR, imgR * 2, imgR * 2);
    if (img) {
      // zona "crop" de la foto, sin deformar
      const [sx, sy, side] = cropBox(p, img);
      ctx.drawImage(img, sx, sy, side, side, -imgR, imgY - imgR, imgR * 2, imgR * 2);
    }
    ctx.restore();
    ctx.restore();
  });

  // Base oscura bajo el centro
  ctx.beginPath(); ctx.arc(c, c, r * 0.2, 0, TAU);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fill();
}

/* ---------------------------------------------------------------------
   5. SONIDO (Web Audio, sin archivos)
   --------------------------------------------------------------------- */
let audioCtx = null;
function ensureAudio() {
  if (!SETTINGS.sound) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { audioCtx = null; }
}
function playTick() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(1900, t); o.frequency.exponentialRampToValueAtTime(900, t + 0.03);
  g.gain.setValueAtTime(0.07, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
  o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + 0.05);
}
function playWin() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    const s = t + i * 0.11;
    g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.12, s + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, s + 0.6);
    o.connect(g).connect(audioCtx.destination); o.start(s); o.stop(s + 0.65);
  });
}

/* ---------------------------------------------------------------------
   6. GIRO
   a) Se elige el ganador ANTES de animar.
   b) Se calcula el ángulo final para que la flecha (arriba) caiga
      dentro de ese segmento, con un pequeño margen aleatorio para que
      no siempre pare en el centro exacto.
   c) Se anima con desaceleración (easeOutQuart).
   --------------------------------------------------------------------- */
const spinBtn = document.getElementById('spinBtn');
const hubBtn = document.getElementById('hubBtn');   // centro de la ruleta
const resetBtn = document.getElementById('resetBtn'); // reiniciar (arriba a la izquierda)
const pointer = document.getElementById('pointer');
let rotation = 0;        // grados acumulados actuales
let spinning = false;

const easeOutQuart = t => 1 - Math.pow(1 - t, 4);
const randBetween = (a, b) => a + secureRandom() * (b - a);
const norm = d => ((d % 360) + 360) % 360;
// Índice del segmento bajo la flecha para una rotación dada
const segmentAt = rot => Math.floor(norm(-rot) / SEG) % active.length;

function spin() {
  if (spinning) return;
  ensureAudio();
  spinning = true;
  spinBtn.disabled = true;
  hubBtn.disabled = true;
  resetBtn.disabled = true;

  // a) ganador
  const winner = pickWeightedIndex(active.map(pi => PRIZES[pi]));   // posición en la ruleta

  // b) ángulo destino: la flecha apunta al ángulo (-rotación) de la rueda
  const jitter = randBetween(-SEG * 0.35, SEG * 0.35);
  const targetOnWheel = winner * SEG + SEG / 2 + jitter;   // posición dentro de la rueda
  const desired = norm(-targetOnWheel);                     // rotación módulo 360 necesaria
  let delta = desired - norm(rotation);
  if (delta < 0) delta += 360;
  const spins = Math.floor(randBetween(SETTINGS.minSpins, SETTINGS.maxSpins + 1));
  const start = rotation;
  const end = rotation + spins * 360 + delta;
  const duration = randBetween(SETTINGS.minDuration, SETTINGS.maxDuration);

  // c) animación
  let lastSeg = segmentAt(start);
  const t0 = performance.now();
  function frame(now) {
    const t = Math.min(1, (now - t0) / duration);
    rotation = start + (end - start) * easeOutQuart(t);
    wheel.style.transform = `rotate(${rotation}deg)`;

    const seg = segmentAt(rotation);
    if (seg !== lastSeg) {
      lastSeg = seg;
      playTick();
      pointer.classList.remove('flick'); void pointer.offsetWidth; pointer.classList.add('flick');
    }

    if (t < 1) requestAnimationFrame(frame);
    else {
      rotation = end;
      wheel.style.transform = `rotate(${rotation}deg)`;
      setTimeout(() => showResult(winner), 350);
    }
  }
  requestAnimationFrame(frame);
}

/* ---------------------------------------------------------------------
   7. RESULTADO
   --------------------------------------------------------------------- */
const overlay = document.getElementById('overlay');
const card = document.getElementById('card');
const wonImg = document.getElementById('wonImg');
const wonName = document.getElementById('wonName');
const nextBtn = document.getElementById('nextBtn');
const removeBtn = document.getElementById('removeBtn');

let lastWon = -1;   // premio (posición en PRIZES) que acaba de salir

function showResult(pos) {
  const i = active[pos];
  lastWon = i;
  const p = PRIZES[i];
  removeBtn.hidden = active.length < 2;   // siempre queda al menos un premio
  wonName.textContent = p.name;
  if (images[i]) { wonImg.src = images[i].src; wonImg.style.display = ''; }
  else wonImg.style.display = 'none';
  wonImg.alt = p.name;
  card.classList.toggle('featured', !!p.featured);
  overlay.classList.add('show');
  playWin();
  launchConfetti(!!p.featured);
}

function nextParticipant() {
  overlay.classList.remove('show');
  stopConfetti();
  spinning = false;
  spinBtn.disabled = false;
  hubBtn.disabled = false;
  resetBtn.disabled = false;
  // Se normaliza la rotación para que el número no crezca sin límite
  rotation = norm(rotation);
  wheel.style.transform = `rotate(${rotation}deg)`;
}

/* ---------------------------------------------------------------------
   8. CONFETI (canvas ligero)
   --------------------------------------------------------------------- */
const cf = document.getElementById('confetti');
const cfx = cf.getContext('2d');
let pieces = [], cfRaf = null;

function launchConfetti(big) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cf.width = innerWidth * dpr; cf.height = innerHeight * dpr;
  cfx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colors = big
    ? ['#D4AF55', '#F3E3B5', '#FFFFFF', '#E9CC7C', '#A67C2E', '#1F3C7A']
    : ['#D4AF55', '#F3E3B5', '#FFFFFF', '#1F3C7A', '#A67C2E'];
  pieces = [];
  const make = (x, y, vx, vy, k) => {
    const shape = k % 7 === 0 ? 'ribbon' : (k % 5 === 0 ? 'dot' : 'rect');
    pieces.push({
      x, y, vx, vy, shape,
      w: randBetween(6, 11), h: randBetween(8, 16), len: randBetween(26, 46),
      rot: randBetween(0, Math.PI * 2), vr: randBetween(-0.25, 0.25),
      phase: randBetween(0, 6), color: colors[k % colors.length], life: 0,
    });
  };
  // Cañones de cotillón desde las esquinas inferiores
  const burst = big ? 220 : 150;
  for (let k = 0; k < burst; k++) {
    const fromLeft = k % 2 === 0;
    make(fromLeft ? -10 : innerWidth + 10, innerHeight * randBetween(0.55, 0.9),
         (fromLeft ? 1 : -1) * randBetween(4, 12), -randBetween(10, 19), k);
  }
  // Lluvia suave desde arriba
  const rain = big ? 140 : 80;
  for (let k = 0; k < rain; k++) {
    make(randBetween(0, innerWidth), -randBetween(10, innerHeight * 0.8),
         randBetween(-1.5, 1.5), randBetween(1, 3), k + 3);
  }
  cancelAnimationFrame(cfRaf);
  const tick = () => {
    cfx.clearRect(0, 0, innerWidth, innerHeight);
    let alive = 0;
    for (const p of pieces) {
      const drag = p.shape === 'ribbon' ? 0.975 : 0.985;
      p.vy += p.shape === 'ribbon' ? 0.2 : 0.3;
      p.vx *= drag; p.vy *= drag;
      if (p.vy > 4.5) p.vy = 4.5; // caída lenta y elegante
      p.x += p.vx + Math.sin(p.life * 0.05 + p.phase) * 0.6;
      p.y += p.vy; p.rot += p.vr; p.life++;
      if (p.y < innerHeight + 40) alive++;
      cfx.save(); cfx.translate(p.x, p.y); cfx.rotate(p.rot);
      cfx.fillStyle = p.color; cfx.strokeStyle = p.color;
      if (p.shape === 'ribbon') {
        // serpentina ondulada
        cfx.lineWidth = 3.2; cfx.lineCap = 'round';
        cfx.beginPath();
        for (let s = 0; s <= 12; s++) {
          const u = s / 12;
          const xx = (u - 0.5) * p.len;
          const yy = Math.sin(u * Math.PI * 2 + p.life * 0.15 + p.phase) * 5;
          s ? cfx.lineTo(xx, yy) : cfx.moveTo(xx, yy);
        }
        cfx.stroke();
      } else if (p.shape === 'dot') {
        cfx.beginPath(); cfx.arc(0, 0, p.w * 0.45, 0, Math.PI * 2); cfx.fill();
      } else {
        cfx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.life * 0.12 + p.phase)));
      }
      cfx.restore();
    }
    if (alive) cfRaf = requestAnimationFrame(tick);
    else cfx.clearRect(0, 0, innerWidth, innerHeight);
  };
  tick();
}
function stopConfetti() {
  cancelAnimationFrame(cfRaf); pieces = [];
  cfx.clearRect(0, 0, cf.width, cf.height);
}

/* ---------------------------------------------------------------------
   9. TIRA DE PREMIOS + PANTALLA COMPLETA + INICIO
   --------------------------------------------------------------------- */
// Miniatura redonda de la tira: la misma zona "crop" que en la ruleta
function thumbSrc(i) {
  const img = images[i];
  try {
    const [sx, sy, side] = cropBox(PRIZES[i], img);
    const size = 240, cv = document.createElement('canvas');
    cv.width = cv.height = size;
    const g = cv.getContext('2d');
    g.imageSmoothingQuality = 'high';
    g.drawImage(img, sx, sy, side, side, 0, 0, size, size);
    return cv.toDataURL('image/jpeg', 0.9);
  } catch (e) { return img.src; }   // p. ej. abierto como archivo local
}

const thumbs = [];   // miniaturas ya recortadas

function buildStrip() {
  const strip = document.getElementById('prizeStrip');
  strip.innerHTML = '';
  strip.style.gridTemplateColumns = `repeat(${PRIZES.length}, 1fr)`;
  PRIZES.forEach((p, i) => {
    const out = !active.includes(i);                     // quitado de la ruleta
    const el = document.createElement(out ? 'button' : 'div');
    el.className = 'prize' + (p.featured ? ' featured' : '') + (out ? ' agotado' : '');
    if (out) {
      el.type = 'button';
      el.setAttribute('aria-label', `${p.name}, agotado. Toca para volver a ponerlo en la ruleta`);
      el.addEventListener('click', () => askRestore(i));
    }
    const pic = document.createElement('div');
    pic.className = 'pic';
    const img = document.createElement('img');
    img.alt = out ? '' : p.name;
    if (images[i]) img.src = thumbs[i] || (thumbs[i] = thumbSrc(i));
    pic.append(img);
    if (out) {
      const badge = document.createElement('em');
      badge.className = 'badge';
      badge.textContent = 'Agotado';
      pic.append(badge);
    }
    const label = document.createElement('span');
    label.textContent = p.name;
    el.append(pic, label);
    strip.appendChild(el);
  });
}

/* ---------------------------------------------------------------------
   10. QUITAR Y VOLVER A PONER PREMIOS
   Después de cada premio se puede quitar de la ruleta. La ruleta se
   vuelve a dibujar sin él y su probabilidad se reparte entre los que
   quedan, en proporción a su "weight" (con pesos iguales, en partes
   iguales). Siempre queda al menos un premio.
   En la tira de abajo el premio quitado sale como "Agotado": al tocarlo
   se puede volver a poner. Los premios quitados se recuerdan en este
   dispositivo aunque la página se recargue o se cierre.
   --------------------------------------------------------------------- */
const ask = document.getElementById('ask');
const askTitle = document.getElementById('askTitle');
const askText = document.getElementById('askText');
const askYes = document.getElementById('askYes');
const askNo = document.getElementById('askNo');
const toastEl = document.getElementById('toast');
let askAction = null, toastTimer = null;

// Memoria en este dispositivo: nombres de los premios quitados
const STORE_KEY = 'club-de-los-3500:premios-quitados';
function loadRemoved() {
  if (!SETTINGS.remember) return [];
  try {
    const v = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
    return Array.isArray(v) ? v : [];
  } catch (e) { return []; }          // navegador sin almacenamiento: no se recuerda
}
function saveRemoved() {
  if (!SETTINGS.remember) return;
  try {
    const out = PRIZES.filter((_, i) => !active.includes(i)).map(p => p.name);
    if (out.length) localStorage.setItem(STORE_KEY, JSON.stringify(out));
    else localStorage.removeItem(STORE_KEY);
  } catch (e) {}
}

// Cómo queda la probabilidad con esta lista de premios
function shareText(list) {
  if (list.length === 1) return `Quedará solo «${PRIZES[list[0]].name}» y saldrá en todos los giros.`;
  const w = list.map(pi => Math.max(0, PRIZES[pi].weight));
  const total = w.reduce((a, b) => a + b, 0) || 1;
  const pct = w.map(x => Math.round(x / total * 100));
  if (pct.every(x => x === pct[0])) return `Quedarán ${list.length} premios con ${pct[0]}% cada uno.`;
  return 'Nueva probabilidad: ' + list.map((pi, k) => `${PRIZES[pi].name} ${pct[k]}%`).join(', ') + '.';
}

function openAsk(title, text, yesLabel, action) {
  askTitle.textContent = title;
  askText.textContent = text;
  askYes.textContent = yesLabel;
  askAction = action;
  ask.classList.add('show');
  askNo.focus();
}
function closeAsk() { ask.classList.remove('show'); askAction = null; }

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3200);
}

function refreshWheel() { updateGeometry(); drawWheel(); buildStrip(); }

function askRemove() {
  const i = lastWon;
  if (i < 0 || active.length < 2 || !active.includes(i)) return;
  const rest = active.filter(k => k !== i);
  openAsk(`¿Quitar «${PRIZES[i].name}» de la ruleta?`, shareText(rest), 'Sí, quitar', () => {
    active = rest;
    saveRemoved();
    refreshWheel();
    nextParticipant();
    showToast(`«${PRIZES[i].name}» ya no está en la ruleta.`);
  });
}

function askRestore(i) {
  if (spinning || active.includes(i)) return;
  const back = PRIZES.map((_, k) => k).filter(k => k === i || active.includes(k));   // mismo orden que PRIZES
  openAsk(`¿Volver a poner «${PRIZES[i].name}» en la ruleta?`, shareText(back), 'Sí, volver a ponerlo', () => {
    active = back;
    saveRemoved();
    refreshWheel();
    showToast(`«${PRIZES[i].name}» volvió a la ruleta.`);
  });
}

/* Reiniciar: vuelven todos los premios a la ruleta (con su probabilidad
   original), se borra lo recordado en este dispositivo y la ruleta
   vuelve a su posición inicial. */
function askReset() {
  if (spinning) return;
  const all = PRIZES.map((_, k) => k);
  const quitados = PRIZES.length - active.length;
  const text = (quitados
    ? (quitados === 1 ? 'Vuelve el premio quitado. ' : `Vuelven los ${quitados} premios quitados. `)
    : 'Todos los premios ya están en la ruleta. ') + shareText(all);
  openAsk('¿Reiniciar la ruleta?', text, 'Sí, reiniciar', () => {
    active = all;
    saveRemoved();
    rotation = 0;
    wheel.style.transform = 'rotate(0deg)';
    refreshWheel();
    showToast('Ruleta reiniciada: todos los premios están en juego.');
  });
}

askYes.addEventListener('click', () => { const a = askAction; closeAsk(); if (a) a(); });
askNo.addEventListener('click', closeAsk);
ask.addEventListener('click', e => { if (e.target === ask) closeAsk(); });   // tocar fuera = cancelar
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ask.classList.contains('show')) closeAsk(); });

function setupFullscreen() {
  const btn = document.getElementById('fsBtn');
  const root = document.documentElement;
  const req = root.requestFullscreen || root.webkitRequestFullscreen;
  if (!req) return;
  btn.style.display = 'flex';
  document.documentElement.classList.add('has-fs');
  btn.addEventListener('click', () => {
    const inFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (inFs) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else req.call(root);
  });
}

async function init() {
  const bgLoad = SETTINGS.background ? loadImage(SETTINGS.background) : Promise.resolve(null);
  images = await Promise.all(PRIZES.map(p => loadImage(p.image)));
  // Premios que ya se habían quitado en este dispositivo
  const removed = loadRemoved();
  const keep = PRIZES.map((_, i) => i).filter(i => !removed.includes(PRIZES[i].name));
  if (keep.length && keep.length < PRIZES.length) { active = keep; updateGeometry(); }
  wheelArt = WHEEL_ART.image ? await loadImage(WHEEL_ART.image) : null;
  const bg = await bgLoad;
  if (bg) document.body.style.backgroundImage =
    'radial-gradient(ellipse 80% 50% at 50% 45%, rgba(212,175,85,.10) 0%, rgba(212,175,85,0) 70%), ' +
    'linear-gradient(180deg, rgba(6,14,32,.55) 0%, rgba(6,14,32,.15) 38%, rgba(6,14,32,.2) 62%, rgba(6,14,32,.7) 100%), ' +
    `url("${bg.src}")`;
  if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
  drawWheel();
  buildStrip();
  setupFullscreen();
  spinBtn.addEventListener('click', spin);
  hubBtn.addEventListener('click', spin);            // el centro de la ruleta también gira
  removeBtn.addEventListener('click', askRemove);
  resetBtn.addEventListener('click', askReset);
  nextBtn.addEventListener('click', nextParticipant);
  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawWheel, 120); });
}
window.addEventListener('load', init);
</script>
